<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Portafolio de Gabriela Castro — Ingeniera Full Stack. Construyo productos web y SaaS escalables con React, Django y AWS, con 3+ años de experiencia en producción."
    />
    <title>Gabriela Castro — Ingeniera Full Stack · Productos web y SaaS escalables</title>

    <!-- Open Graph -->
    <meta property="og:title" content="Gabriela Castro — Ingeniera Full Stack · Productos web y SaaS escalables" />
    <meta
      property="og:description"
      content="Construyo productos web y SaaS escalables con React, Django y AWS, con 3+ años de experiencia en producción."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://portfoliogch.netlify.app/" />
    <meta property="og:image" content="https://portfoliogch.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://portfoliogch.netlify.app/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!--
      Skill icon origins (see src/lib/skillIcons.js). All three are reached by
      real resolved URLs: simpleicons.org is the default CDN, jsDelivr and
      Iconify serve the ICON_SOURCE_OVERRIDES slugs. Warming the handshake here
      saves ~3 RTTs each on cold connections when preloadAssets.js fires at idle.
    -->
    <link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://api.iconify.design" crossorigin />
  </head>
  <body>
    <script>
      (function() {
        var t = localStorage.getItem('portfolio-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      })();
    </script>

    <!--
      Static Netlify Forms detection form.
      Netlify only parses forms present in the built static HTML — this SPA submits
      the real form via fetch() from Contact.jsx, but this hidden duplicate is what
      lets Netlify's build bot register the "contact" form and its fields.
      Field names below must stay in sync with src/sections/Contact.jsx.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
